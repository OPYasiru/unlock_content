<!DOCTYPE html>
<html lang="en">
<head> 
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Get Your File</title>
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="favicon.png">
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #8b5cf6; /* Violet / Purple */
            --primary-glow: rgba(139, 92, 246, 0.35);
            --success: #10b981; /* Emerald Green */
            --success-glow: rgba(16, 185, 129, 0.35);
            --bg-color: #07090e;
            --card-bg: #111827;
            --border-color: rgba(139, 92, 246, 0.2);
            --text-main: #f8fafc;
            --text-muted: #cbd5e1;
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-color);
            background-image: radial-gradient(circle at center, #111827 0%, #07090e 100%);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }

        .container {
            background: var(--card-bg);
            padding: 28px 24px;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6), 0 0 25px rgba(139, 92, 246, 0.1);
            text-align: center;
            max-width: 380px;
            width: 100%;
            border: 1px solid var(--border-color);
        }

        /* Step Progress Indicator */
        .step-indicator {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 20px;
        }

        .step-badge {
            font-size: 11px;
            font-weight: 600;
            padding: 5px 12px;
            border-radius: 20px;
            background: #1f2937;
            color: #94a3b8;
            border: 1px solid #374151;
            transition: all 0.3s ease;
        }

        .step-badge.active {
            background: rgba(139, 92, 246, 0.2);
            color: #c084fc;
            border-color: #8b5cf6;
            box-shadow: 0 0 10px rgba(139, 92, 246, 0.3);
        }

        .step-badge.completed {
            background: rgba(16, 185, 129, 0.2);
            color: #34d399;
            border-color: #10b981;
        }

        .step-divider {
            width: 25px;
            height: 2px;
            background: #374151;
            border-radius: 2px;
        }

        .step-divider.filled {
            background: #10b981;
        }

        /* Soft Ring Glow Animation */
        @keyframes softPulse {
            0% { box-shadow: 0 0 0 0 rgba(139, 92, 246, 0.4); }
            70% { box-shadow: 0 0 0 12px rgba(139, 92, 246, 0); }
            100% { box-shadow: 0 0 0 0 rgba(139, 92, 246, 0); }
        }

        @keyframes successPulse {
            0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.4); }
            70% { box-shadow: 0 0 0 12px rgba(16, 185, 129, 0); }
            100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }

        .icon-box {
            width: 72px;
            height: 72px;
            background: rgba(139, 92, 246, 0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px auto;
            border: 1px solid rgba(139, 92, 246, 0.3);
            animation: softPulse 2.5s infinite;
            transition: all 0.3s ease;
        }

        .icon-top {
            font-size: 30px;
            color: #a78bfa;
        }

        h1 {
            font-size: 21px;
            font-weight: 600;
            margin-bottom: 6px;
            letter-spacing: 0.3px;
        }

        p {
            color: var(--text-muted);
            font-size: 13px;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        /* Animated Glowing Buttons */
        @keyframes btnGlow {
            0% { box-shadow: 0 4px 15px rgba(139, 92, 246, 0.25); }
            50% { box-shadow: 0 4px 25px rgba(139, 92, 246, 0.6); }
            100% { box-shadow: 0 4px 15px rgba(139, 92, 246, 0.25); }
        }

        @keyframes btnDownloadGlow {
            0% { box-shadow: 0 4px 15px rgba(16, 185, 129, 0.25); }
            50% { box-shadow: 0 4px 25px rgba(16, 185, 129, 0.6); }
            100% { box-shadow: 0 4px 15px rgba(16, 185, 129, 0.25); }
        }

        .btn {
            background: linear-gradient(135deg, #8b5cf6, #7c3aed);
            color: white;
            border: none;
            padding: 14px 20px;
            font-size: 14px;
            font-weight: 600;
            border-radius: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            animation: btnGlow 3s infinite ease-in-out;
            transition: transform 0.2s ease;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-download {
            background: linear-gradient(135deg, #10b981, #059669);
            animation: btnDownloadGlow 3s infinite ease-in-out;
        }

        /* Circular Progress Timer */
        .timer-container {
            display: none;
            margin-bottom: 20px;
        }

        .circular-progress {
            position: relative;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: conic-gradient(#8b5cf6 360deg, #1f2937 0deg);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 14px auto;
            box-shadow: 0 0 20px rgba(139, 92, 246, 0.15);
            transition: background 0.1s linear;
        }

        .circular-progress::before {
            content: "";
            position: absolute;
            width: 82px;
            height: 82px;
            border-radius: 50%;
            background: var(--card-bg);
        }

        .time-display {
            position: relative;
            font-size: 28px;
            font-weight: 700;
            color: #f3e8ff;
        }

        /* SweetAlert2 Popup Style */
        .swal2-popup {
            background: #111827 !important;
            color: #f8fafc !important;
            border: 1px solid var(--border-color);
            border-radius: 24px !important;
            font-family: inherit !important;
            width: 320px !important;
            padding: 22px 18px !important;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8) !important;
        }
        .swal2-title {
            color: #f8fafc !important;
            font-size: 19px !important;
            margin-bottom: 8px !important;
        }
        .swal2-html-container {
            color: var(--text-muted) !important;
            font-size: 13px !important;
            line-height: 1.5 !important;
        }
        .swal2-actions {
            margin-top: 18px !important;
        }
        .swal2-confirm {
            background: linear-gradient(135deg, #8b5cf6, #7c3aed) !important;
            border-radius: 12px !important;
            padding: 9px 22px !important;
            font-weight: 600 !important;
            box-shadow: 0 4px 15px var(--primary-glow) !important;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Step Bar -->
        <div class="step-indicator" id="stepIndicator">
            <span class="step-badge active" id="badgeStep1">Step 1</span>
            <div class="step-divider" id="stepDivider"></div>
            <span class="step-badge" id="badgeStep2">Step 2</span>
        </div>

        <div class="icon-box" id="iconBox">
            <i class="fa-solid fa-lock icon-top" id="mainIcon"></i>
        </div>
        
        <h1 id="mainTitle">Get Your File</h1>
        <p id="instructionText">Click below, wait 10 seconds on the opened page, then come back here.</p>

        <!-- Circular Timer -->
        <div class="timer-container" id="timerContainer">
            <div class="circular-progress" id="progressCircle">
                <div class="time-display" id="timeDisplay">10</div>
            </div>
            <p style="margin: 0; font-size: 13px; color: var(--text-muted);" id="timerSubText">Verifying visit...</p>
        </div>

        <!-- Buttons -->
        <button class="btn" id="actionBtn">
            <i class="fa-solid fa-arrow-right"></i> Start Step 1
        </button>
        
        <button class="btn btn-download" id="downloadBtn" style="display: none;">
            <i class="fa-brands fa-telegram"></i> Open in Telegram
        </button>
    </div>

    <script>
        const BOT_USERNAME = "FileStoreSl_bot";
        
        // Monetag Direct Links දෙක
        const AD_DIRECT_LINK_1 = "https://uplcm.com/4/11949839";
        const AD_DIRECT_LINK_2 = "https://uplcm.com/4/12015244"; // දෙවැනි Direct Link එක මෙතැනට දමන්න

        // Timer සැකසුම් (තත්පර 10)
        const STEP_TIME = 10;       // මුළු කාලය (Seconds)
        const MIN_STAY_TIME = 10;   // රැඳී සිටිය යුතු අවම කාලය (Seconds)

        // Compact Token Decryptor Setup
        const CHARS = "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz-_";
        const SHIFT = 27;

        function descramble(str) {
            return str.split('').map(c => {
                let idx = CHARS.indexOf(c);
                if (idx === -1) return c;
                let originalIdx = (idx - SHIFT + CHARS.length) % CHARS.length;
                return CHARS[originalIdx];
            }).join('');
        }

        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('t');
        let fileCode = urlParams.get('start');

        if (token) {
            fileCode = descramble(token);
        }

        const actionBtn = document.getElementById('actionBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const timerContainer = document.getElementById('timerContainer');
        const timeDisplay = document.getElementById('timeDisplay');
        const progressCircle = document.getElementById('progressCircle');
        const instructionText = document.getElementById('instructionText');
        const mainTitle = document.getElementById('mainTitle');
        const mainIcon = document.getElementById('mainIcon');
        const iconBox = document.getElementById('iconBox');
        const timerSubText = document.getElementById('timerSubText');

        const badgeStep1 = document.getElementById('badgeStep1');
        const badgeStep2 = document.getElementById('badgeStep2');
        const stepDivider = document.getElementById('stepDivider');

        let currentStep = 1;
        let adClickTime = 0;
        let timerInterval;
        let isWaiting = false;

        if (!fileCode) {
            Swal.fire({
                icon: 'error',
                title: 'Oops!',
                text: 'Invalid or missing link.',
                confirmButtonColor: '#8b5cf6'
            });
            actionBtn.style.display = 'none';
            instructionText.innerText = "This link is not valid.";
            mainTitle.innerText = "Error";
            document.getElementById('stepIndicator').style.display = 'none';
        }

        actionBtn.addEventListener('click', () => {
            adClickTime = Date.now();
            isWaiting = true;

            const linkToOpen = (currentStep === 1) ? AD_DIRECT_LINK_1 : AD_DIRECT_LINK_2;
            window.open(linkToOpen, '_blank');

            actionBtn.style.display = 'none';
            timerContainer.style.display = 'block';
            instructionText.style.display = 'none'; 
            mainTitle.innerText = `Verifying Step ${currentStep}...`;

            timerInterval = setInterval(() => {
                let elapsedTime = (Date.now() - adClickTime) / 1000;
                let remainingTime = STEP_TIME - elapsedTime;

                if (remainingTime > 0) {
                    timeDisplay.innerText = Math.ceil(remainingTime);
                    let degree = (remainingTime / STEP_TIME) * 360;
                    progressCircle.style.background = `conic-gradient(#8b5cf6 ${degree}deg, #1f2937 0deg)`;
                    timerSubText.innerHTML = `Verifying in <b>${Math.ceil(remainingTime)}</b>s...`;
                } else {
                    clearInterval(timerInterval);
                    timeDisplay.innerText = "0";
                    progressCircle.style.background = `conic-gradient(#8b5cf6 0deg, #1f2937 0deg)`;
                    handleStepComplete();
                }
            }, 50);
        });

        document.addEventListener("visibilitychange", () => checkUserReturn());
        window.addEventListener("focus", () => checkUserReturn());

        function checkUserReturn() {
            if (!document.hidden && isWaiting) {
                let timeSpent = (Date.now() - adClickTime) / 1000;
                
                if (timeSpent < MIN_STAY_TIME) {
                    clearInterval(timerInterval);
                    isWaiting = false;
                    
                    Swal.fire({
                        icon: 'warning',
                        title: 'Too Fast!',
                        text: `You returned too early. Please stay on the ad page for at least ${MIN_STAY_TIME} seconds to complete Step ${currentStep}.`,
                        confirmButtonColor: '#8b5cf6'
                    }).then(() => {
                        resetCurrentStepUI();
                    });
                }
            }
        }

        function handleStepComplete() {
            let timeSpent = (Date.now() - adClickTime) / 1000;
            isWaiting = false;

            if (timeSpent >= MIN_STAY_TIME) {
                timerContainer.style.display = 'none';
                instructionText.style.display = 'block';

                if (currentStep === 1) {
                    // Step 1 ඉවරයි -> Step 2 වලට මාරු වීම
                    currentStep = 2;
                    badgeStep1.className = "step-badge completed";
                    badgeStep1.innerHTML = "Step 1 ✓";
                    stepDivider.className = "step-divider filled";
                    badgeStep2.className = "step-badge active";

                    mainTitle.innerText = "Step 1 Completed!";
                    instructionText.innerText = "Click below, wait 10 seconds on the page, then return to unlock your file.";
                    actionBtn.innerHTML = '<i class="fa-solid fa-arrow-right"></i> Start Step 2';
                    actionBtn.style.display = 'flex';
                } else {
                    // Step 2 ඉවරයි -> Download Unlock වීම
                    badgeStep2.className = "step-badge completed";
                    badgeStep2.innerHTML = "Step 2 ✓";

                    mainTitle.innerText = "Ready!";
                    instructionText.innerHTML = "Your file is successfully unlocked!";
                    downloadBtn.style.display = 'flex';
                    
                    mainIcon.className = "fa-solid fa-lock-open icon-top";
                    mainIcon.style.color = "#34d399";
                    iconBox.style.animation = "successPulse 2.5s infinite";
                    iconBox.style.background = "rgba(16, 185, 129, 0.1)";
                    iconBox.style.borderColor = "rgba(16, 185, 129, 0.3)";
                    
                    downloadBtn.onclick = () => {
                        window.location.href = `https://t.me/${BOT_USERNAME}?start=${fileCode}`;
                    };
                }
            }
        }

        function resetCurrentStepUI() {
            actionBtn.style.display = 'flex';
            timerContainer.style.display = 'none';
            instructionText.style.display = 'block';
            
            if (currentStep === 1) {
                mainTitle.innerText = "Get Your File";
                instructionText.innerText = "Click below, wait 10 seconds on the opened page, then come back here.";
                actionBtn.innerHTML = '<i class="fa-solid fa-arrow-right"></i> Start Step 1';
            } else {
                mainTitle.innerText = "Step 2 (Final)";
                instructionText.innerText = "Click below, wait 10 seconds on the opened page, then return to unlock.";
                actionBtn.innerHTML = '<i class="fa-solid fa-arrow-right"></i> Start Step 2';
            }
        }
    </script>
    
    <!-- Vercel Web Analytics -->
    <script>
      window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
