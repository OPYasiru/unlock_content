<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Get Your File</title>
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #0088cc;
            --bg-color: #0b0f19;
            --card-bg: #131b2e;
            --border-color: rgba(255, 255, 255, 0.08);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }

        .container {
            background: var(--card-bg);
            padding: 28px 20px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            text-align: center;
            max-width: 360px;
            width: 100%;
            border: 1px solid var(--border-color);
        }

        .icon-box {
            width: 70px;
            height: 70px;
            background: rgba(0, 136, 204, 0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 18px auto;
            border: 1px solid rgba(0, 136, 204, 0.2);
        }

        .icon-top {
            font-size: 30px;
            color: #38bdf8;
        }

        h1 {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 6px;
            letter-spacing: 0.3px;
        }

        p {
            color: var(--text-muted);
            font-size: 13px;
            margin-bottom: 22px;
            line-height: 1.4;
        }

        .btn {
            background: #0088cc;
            color: white;
            border: none;
            padding: 14px 20px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            transition: opacity 0.2s;
        }

        .btn:active {
            opacity: 0.9;
            transform: scale(0.98);
        }

        .btn-download {
            background: #10b981;
        }

        .timer-container {
            display: none;
            background: #090d16;
            padding: 18px;
            border-radius: 14px;
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
        }

        .time-display {
            font-size: 38px;
            font-weight: 700;
            color: #f43f5e;
            margin-bottom: 2px;
        }

        /* SweetAlert2 Custom Popout Animation & Theme */
        .swal2-popup {
            background: #131b2e !important;
            color: #f8fafc !important;
            border: 1px solid var(--border-color);
            border-radius: 20px !important;
            font-family: inherit !important;
        }
        .swal2-title {
            color: #f8fafc !important;
            font-size: 20px !important;
        }
        .swal2-html-container {
            color: var(--text-muted) !important;
            font-size: 13px !important;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="icon-box" id="iconBox">
            <i class="fa-solid fa-lock icon-top" id="mainIcon"></i>
        </div>
        
        <h1 id="mainTitle">Get Your File</h1>
        <p id="instructionText">Click below, wait 10 seconds on the opened page, then come back here.</p>

        <!-- Timer Box (ස්ප්‍රින් එක/Loader එක ඉවත් කර ඇත) -->
        <div class="timer-container" id="timerContainer">
            <div class="time-display" id="timeDisplay">15</div>
            <p style="margin: 0; font-size: 11px; color: var(--text-muted);">Processing request...</p>
        </div>

        <!-- Buttons -->
        <button class="btn" id="unlockBtn">
            <i class="fa-solid fa-lock-open"></i> Unlock Now
        </button>
        
        <button class="btn btn-download" id="downloadBtn" style="display: none;">
            <i class="fa-brands fa-telegram"></i> Open in Telegram
        </button>
    </div>

    <script>
        // 🔴🔴 මෙතැන වෙනස් කරන්න 🔴🔴
        const BOT_USERNAME = "FileStoreSl_bot"; // ඔයාගේ Bot Username එක
        const AD_DIRECT_LINK = "https://www.google.com"; // ඔයාගේ Ad Direct Link එක

        const urlParams = new URLSearchParams(window.location.search);
        const fileCode = urlParams.get('start');

        const unlockBtn = document.getElementById('unlockBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const timerContainer = document.getElementById('timerContainer');
        const timeDisplay = document.getElementById('timeDisplay');
        const instructionText = document.getElementById('instructionText');
        const mainTitle = document.getElementById('mainTitle');
        const mainIcon = document.getElementById('mainIcon');
        const iconBox = document.getElementById('iconBox');

        let adClickTime = 0;
        let timeLeft = 15;
        let timerInterval;
        let isWaiting = false;

        if (!fileCode) {
            Swal.fire({
                icon: 'error',
                title: 'Oops!',
                text: 'Invalid or missing link.',
                showClass: { popup: 'swal2-show' },
                hideClass: { popup: 'swal2-hide' }
            });
            unlockBtn.style.display = 'none';
            instructionText.innerText = "This link is not valid.";
            mainTitle.innerText = "Error";
        }

        unlockBtn.addEventListener('click', () => {
            adClickTime = Date.now();
            isWaiting = true;
            timeLeft = 15;

            window.open(AD_DIRECT_LINK, '_blank');

            unlockBtn.style.display = 'none';
            timerContainer.style.display = 'block';
            instructionText.innerText = "Please wait while preparing your file...";
            mainTitle.innerText = "Unlocking...";
            timeDisplay.innerText = timeLeft;
            
            mainIcon.className = "fa-solid fa-spinner fa-spin icon-top";

            timerInterval = setInterval(() => {
                timeLeft--;
                if (timeLeft > 0) {
                    timeDisplay.innerText = timeLeft;
                } else {
                    clearInterval(timerInterval);
                    checkFinalStatus();
                }
            }, 1000);
        });

        // 🔴 Tab මාරු කළත් හෝ Ad Tab එක Close කරලා ආවත් වැඩ කරන Logic එක
        document.addEventListener("visibilitychange", () => {
            checkUserReturn();
        });

        window.addEventListener("focus", () => {
            checkUserReturn();
        });

        function checkUserReturn() {
            if (!document.hidden && isWaiting) {
                let timeSpent = (Date.now() - adClickTime) / 1000;
                
                // යූසර් තත්පර 10කට වඩා කලින් ආවොත් (Tab මාරු කරලා හෝ Tab එක වහලා ආවත්) වහාම අල්ලා Error එක පෙන්වයි
                if (timeSpent < 10) {
                    clearInterval(timerInterval);
                    isWaiting = false;
                    
                    Swal.fire({
                        icon: 'warning',
                        title: 'Too Fast!',
                        text: 'You returned too early. Please stay on the ad page for at least 10 seconds.',
                        confirmButtonColor: '#f43f5e',
                        showClass: {
                            popup: 'animate__animated animate__zoomIn animate__faster'
                        },
                        hideClass: {
                            popup: 'animate__animated animate__zoomOut animate__faster'
                        }
                    }).then(() => {
                        resetUI();
                    });
                }
            }
        }

        function checkFinalStatus() {
            let timeSpent = (Date.now() - adClickTime) / 1000;
            isWaiting = false;

            if (timeSpent >= 10) {
                timerContainer.style.display = 'none';
                mainTitle.innerText = "Ready!";
                instructionText.innerHTML = "Your file is successfully unlocked!";
                downloadBtn.style.display = 'flex';
                
                mainIcon.className = "fa-solid fa-lock-open icon-top";
                mainIcon.style.color = "#10b981";
                iconBox.style.background = "rgba(16, 185, 129, 0.1)";
                iconBox.style.borderColor = "rgba(16, 185, 129, 0.3)";
                
                downloadBtn.onclick = () => {
                    window.location.href = `https://t.me/${BOT_USERNAME}?start=${fileCode}`;
                };
            }
        }

        function resetUI() {
            unlockBtn.style.display = 'flex';
            timerContainer.style.display = 'none';
            downloadBtn.style.display = 'none';
            mainTitle.innerText = "Get Your File";
            instructionText.innerText = "Click below, wait 10 seconds on the opened page, then come back here.";
            
            mainIcon.className = "fa-solid fa-lock icon-top";
            mainIcon.style.color = "#38bdf8";
            iconBox.style.background = "rgba(0, 136, 204, 0.1)";
            iconBox.style.borderColor = "rgba(0, 136, 204, 0.2)";
        }
    </script>
</body>
</html>
