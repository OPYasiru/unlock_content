<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get Your File</title>
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- FontAwesome (Icons) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #0088cc;
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            --card-bg: rgba(30, 41, 59, 0.75);
            --border-color: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }

        .container {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 32px 24px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            text-align: center;
            max-width: 380px;
            width: 100%;
            border: 1px solid var(--border-color);
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .icon-box {
            width: 80px;
            height: 80px;
            background: rgba(0, 136, 204, 0.15);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px auto;
            border: 2px solid rgba(0, 136, 204, 0.3);
            box-shadow: 0 0 20px rgba(0, 136, 204, 0.2);
            transition: all 0.3s ease;
        }

        .icon-top {
            font-size: 36px;
            color: #38bdf8;
        }

        h1 {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        p {
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 24px;
            line-height: 1.5;
        }

        .btn {
            background: linear-gradient(135deg, #0088cc, #0284c7);
            color: white;
            border: none;
            padding: 16px 24px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 20px rgba(0, 136, 204, 0.35);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
        }

        .btn:active {
            transform: scale(0.97);
        }

        .btn-download {
            background: linear-gradient(135deg, #10b981, #059669);
            box-shadow: 0 8px 20px rgba(16, 185, 129, 0.35);
        }

        .timer-container {
            display: none;
            background: rgba(15, 23, 42, 0.6);
            padding: 20px;
            border-radius: 16px;
            margin-bottom: 20px;
            border: 1px dashed rgba(255, 255, 255, 0.15);
        }

        .time-display {
            font-size: 38px;
            font-weight: 800;
            color: #f43f5e;
            text-shadow: 0 0 12px rgba(244, 63, 94, 0.3);
            margin-bottom: 4px;
        }

        .loader {
            border: 3px solid rgba(255,255,255,0.1);
            border-top: 3px solid #38bdf8;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 0.8s linear infinite;
            margin: 12px auto 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="icon-box" id="iconBox">
            <i class="fa-solid fa-lock icon-top" id="mainIcon"></i>
        </div>
        
        <h1 id="mainTitle">Get Your File</h1>
        <p id="instructionText">Click below, wait 10 seconds on the opened page, then come back here.</p>

        <!-- Timer Box -->
        <div class="timer-container" id="timerContainer">
            <div class="time-display" id="timeDisplay">15</div>
            <p style="margin: 0; font-size: 12px; color: #94a3b8;">Please wait patiently...</p>
            <div class="loader"></div>
        </div>

        <!-- Buttons -->
        <button class="btn" id="unlockBtn">
            <i class="fa-solid fa-lock-open"></i> Unlock Now
        </button>
        
        <button class="btn btn-download" id="downloadBtn" style="display: none;">
            <i class="fa-brands fa-telegram"></i> Open in Telegram
        </button>
    </div>

    <script>
        // 🔴🔴 මෙතැන වෙනස් කරන්න 🔴🔴
        const BOT_USERNAME = "FileStoreSl_bot"; // ඔයාගේ Bot Username එක
        const AD_DIRECT_LINK = "https://www.google.com"; // ඔයාගේ Ad Direct Link එක

        const urlParams = new URLSearchParams(window.location.search);
        const fileCode = urlParams.get('start');

        const unlockBtn = document.getElementById('unlockBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const timerContainer = document.getElementById('timerContainer');
        const timeDisplay = document.getElementById('timeDisplay');
        const instructionText = document.getElementById('instructionText');
        const mainTitle = document.getElementById('mainTitle');
        const mainIcon = document.getElementById('mainIcon');
        const iconBox = document.getElementById('iconBox');

        let adClickTime = 0;
        let timeLeft = 15;
        let timerInterval;
        let isWaiting = false;

        if (!fileCode) {
            Swal.fire({
                icon: 'error',
                title: 'Oops!',
                text: 'Invalid or missing link.',
                background: '#1e293b',
                color: '#fff',
                confirmButtonColor: '#0088cc'
            });
            unlockBtn.style.display = 'none';
            instructionText.innerText = "This link is not valid.";
            mainTitle.innerText = "Error";
        }

        unlockBtn.addEventListener('click', () => {
            adClickTime = Date.now();
            isWaiting = true;
            timeLeft = 15;

            window.open(AD_DIRECT_LINK, '_blank');

            unlockBtn.style.display = 'none';
            timerContainer.style.display = 'block';
            instructionText.innerText = "Processing your request...";
            mainTitle.innerText = "Unlocking...";
            timeDisplay.innerText = timeLeft;
            
            mainIcon.className = "fa-solid fa-spinner fa-spin icon-top";
            iconBox.style.borderColor = "rgba(56, 189, 248, 0.5)";

            // තත්පර 15 ටයිමර් එක පටන් ගැනීම (කලින් අතරමඟදී කපන්නේ නැත, අගටම දුවයි)
            timerInterval = setInterval(() => {
                timeLeft--;
                if (timeLeft > 0) {
                    timeDisplay.innerText = timeLeft;
                } else {
                    clearInterval(timerInterval);
                    checkFinalStatus(); // ටයිමර් එක ඉවර වුණාම පරීක්ෂා කර බැලීම
                }
            }, 1000);
        });

        // මෙතන visibilitychange එකෙන් දැන් අර මැදදි බාධා කරන්නේ නැත. 
        // පරිශීලකයා Tab මාරු කළත් ටයිමර් එක දිගටම 15 දක්වා යයි.

        // ටයිමර් එක සම්පූර්ණයෙන්ම අවසාන වූ පසු ක්‍රියාත්මක වන කොටස
        function checkFinalStatus() {
            let timeSpent = (Date.now() - adClickTime) / 1000;
            isWaiting = false;

            // දැන් මෙතනදි බලනවා එයා ඇත්තටම Ad එකේ තත්පර 10ක් හිටියාද කියලා
            if (timeSpent >= 10) {
                // සාර්ථකයි! (තත්පර 10ට වඩා වැඩි කාලයක් හිටලා තියෙනවා)
                timerContainer.style.display = 'none';
                mainTitle.innerText = "Ready!";
                instructionText.innerHTML = "Your file is successfully unlocked!";
                downloadBtn.style.display = 'flex';
                
                mainIcon.className = "fa-solid fa-lock-open icon-top";
                mainIcon.style.color = "#10b981";
                iconBox.style.background = "rgba(16, 185, 129, 0.15)";
                iconBox.style.borderColor = "rgba(16, 185, 129, 0.4)";
                
                downloadBtn.onclick = () => {
                    window.location.href = `https://t.me/${BOT_USERNAME}?start=${fileCode}`;
                };
            } else {
                // අසාර්ථකයි! (ටයිමර් එක 15ටම දිව්වත්, එයා Ad එකේ හිටලා තියෙන්නේ තත්පර 10කට වඩා අඩුවෙන්)
                 Swal.fire({
                    icon: 'error',
                    title: 'Too Fast!',
                    text: 'You did not stay on the ad page for at least 10 seconds. Please try again.',
                    background: '#1e293b',
                    color: '#fff',
                    confirmButtonColor: '#f43f5e'
                 }).then(() => {
                     resetUI();
                 });
            }
        }

        function resetUI() {
            unlockBtn.style.display = 'flex';
            timerContainer.style.display = 'none';
            downloadBtn.style.display = 'none';
            mainTitle.innerText = "Get Your File";
            instructionText.innerText = "Click below, wait 10 seconds on the opened page, then come back here.";
            
            mainIcon.className = "fa-solid fa-lock icon-top";
            mainIcon.style.color = "#38bdf8";
            iconBox.style.background = "rgba(0, 136, 204, 0.15)";
            iconBox.style.borderColor = "rgba(0, 136, 204, 0.3)";
        }
    </script>
</body>
</html>
