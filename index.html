<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Get Your File</title>
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #8b5cf6; /* Violet / Purple */
            --primary-glow: rgba(139, 92, 246, 0.25);
            --success: #10b981; /* Emerald Green */
            --success-glow: rgba(16, 185, 129, 0.25);
            --bg-color: #07090e;
            --card-bg: #111827;
            --border-color: rgba(139, 92, 246, 0.2);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-color);
            background-image: radial-gradient(circle at center, #111827 0%, #07090e 100%);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }

        .container {
            background: var(--card-bg);
            padding: 32px 24px;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6), 0 0 20px rgba(139, 92, 246, 0.08);
            text-align: center;
            max-width: 380px;
            width: 100%;
            border: 1px solid var(--border-color);
        }

        .icon-box {
            width: 75px;
            height: 75px;
            background: rgba(139, 92, 246, 0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px auto;
            border: 1px solid rgba(139, 92, 246, 0.3);
            box-shadow: 0 0 15px var(--primary-glow);
            transition: all 0.3s ease;
        }

        .icon-top {
            font-size: 32px;
            color: #a78bfa;
        }

        h1 {
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 8px;
            letter-spacing: 0.3px;
        }

        p {
            color: var(--text-muted);
            font-size: 13px;
            margin-bottom: 24px;
            line-height: 1.5;
        }

        .btn {
            background: linear-gradient(135deg, #8b5cf6, #7c3aed);
            color: white;
            border: none;
            padding: 15px 20px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            box-shadow: 0 4px 15px var(--primary-glow);
            transition: all 0.2s ease;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-download {
            background: linear-gradient(135deg, #10b981, #059669);
            box-shadow: 0 4px 15px var(--success-glow);
        }

        /* Smooth Circular Progress Timer Styles */
        .timer-container {
            display: none;
            margin-bottom: 24px;
        }

        .circular-progress {
            position: relative;
            width: 110px;
            height: 110px;
            border-radius: 50%;
            background: conic-gradient(#8b5cf6 360deg, #1f2937 0deg);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px auto;
            box-shadow: 0 0 20px rgba(139, 92, 246, 0.15);
            /* Smooth transition සඳහා */
            transition: background 0.1s linear;
        }

        .circular-progress::before {
            content: "";
            position: absolute;
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: var(--card-bg);
        }

        .time-display {
            position: relative;
            font-size: 32px;
            font-weight: 700;
            color: #f3e8ff;
        }

        /* SweetAlert2 Custom Theme */
        .swal2-popup {
            background: #111827 !important;
            color: #f8fafc !important;
            border: 1px solid var(--border-color);
            border-radius: 20px !important;
            font-family: inherit !important;
            box-shadow: 0 20px 40px rgba(0,0,0,0.7) !important;
        }
        .swal2-title {
            color: #f8fafc !important;
            font-size: 20px !important;
        }
        .swal2-html-container {
            color: var(--text-muted) !important;
            font-size: 13px !important;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="icon-box" id="iconBox">
            <i class="fa-solid fa-lock icon-top" id="mainIcon"></i>
        </div>
        
        <h1 id="mainTitle">Get Your File</h1>
        <p id="instructionText">Click below, wait 10 seconds on the opened page, then come back here.</p>

        <!-- Circular Timer Box -->
        <div class="timer-container" id="timerContainer">
            <div class="circular-progress" id="progressCircle">
                <div class="time-display" id="timeDisplay">15</div>
            </div>
            <p style="margin: 0; font-size: 13px; color: var(--text-muted);" id="timerSubText">Verifying your visit...</p>
        </div>

        <!-- Buttons -->
        <button class="btn" id="unlockBtn">
            <i class="fa-solid fa-lock-open"></i> Unlock Now
        </button>
        
        <button class="btn btn-download" id="downloadBtn" style="display: none;">
            <i class="fa-brands fa-telegram"></i> Open in Telegram
        </button>
    </div>

    <script>
        // 🔴🔴 මෙතැන වෙනස් කරන්න 🔴🔴
        const BOT_USERNAME = "FileStoreSl_bot"; // ඔයාගේ Bot Username එක
        const AD_DIRECT_LINK = "https://www.google.com"; // ඔයාගේ Ad Direct Link එක

        const urlParams = new URLSearchParams(window.location.search);
        const fileCode = urlParams.get('start');

        const unlockBtn = document.getElementById('unlockBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const timerContainer = document.getElementById('timerContainer');
        const timeDisplay = document.getElementById('timeDisplay');
        const progressCircle = document.getElementById('progressCircle');
        const instructionText = document.getElementById('instructionText');
        const mainTitle = document.getElementById('mainTitle');
        const mainIcon = document.getElementById('mainIcon');
        const iconBox = document.getElementById('iconBox');
        const timerSubText = document.getElementById('timerSubText');

        let adClickTime = 0;
        let totalTime = 15; // තත්පර 15
        let timerInterval;
        let isWaiting = false;

        if (!fileCode) {
            Swal.fire({
                icon: 'error',
                title: 'Oops!',
                text: 'Invalid or missing link.',
                confirmButtonColor: '#8b5cf6'
            });
            unlockBtn.style.display = 'none';
            instructionText.innerText = "This link is not valid.";
            mainTitle.innerText = "Error";
        }

        unlockBtn.addEventListener('click', () => {
            adClickTime = Date.now();
            isWaiting = true;

            window.open(AD_DIRECT_LINK, '_blank');

            unlockBtn.style.display = 'none';
            timerContainer.style.display = 'block';
            instructionText.style.display = 'none'; 
            mainTitle.innerText = "Verifying your visit...";

            // Smooth progress animation සඳහා setInterval එක මිලි තත්පර 50කින් (සිනිදුවට) ක්‍රියාත්මක වේ
            timerInterval = setInterval(() => {
                let elapsedTime = (Date.now() - adClickTime) / 1000;
                let remainingTime = totalTime - elapsedTime;

                if (remainingTime > 0) {
                    // ඉලක්කම් පෙන්වීම (සම්පූර්ණ තත්පරයට)
                    timeDisplay.innerText = Math.ceil(remainingTime);
                    
                    // රවුම සුමටව (Smoothly) අඩුවීගෙන යාම සඳහා conic-gradient එක වෙනස් කිරීම
                    let degree = (remainingTime / totalTime) * 360;
                    progressCircle.style.background = `conic-gradient(#8b5cf6 ${degree}deg, #1f2937 0deg)`;
                    
                    timerSubText.innerHTML = `The link will unlock in <b>${Math.ceil(remainingTime)}</b> seconds.`;
                } else {
                    clearInterval(timerInterval);
                    timeDisplay.innerText = "0";
                    progressCircle.style.background = `conic-gradient(#8b5cf6 0deg, #1f2937 0deg)`;
                    checkFinalStatus();
                }
            }, 50);
        });

        // Tab මාරු කළත් හෝ Tab එක Close කරලා ආවත් වැඩ කරන Logic එක
        document.addEventListener("visibilitychange", () => {
            checkUserReturn();
        });

        window.addEventListener("focus", () => {
            checkUserReturn();
        });

        function checkUserReturn() {
            if (!document.hidden && isWaiting) {
                let timeSpent = (Date.now() - adClickTime) / 1000;
                
                if (timeSpent < 10) {
                    clearInterval(timerInterval);
                    isWaiting = false;
                    
                    Swal.fire({
                        icon: 'warning',
                        title: 'Too Fast!',
                        text: 'You returned too early. Please stay on the ad page for at least 10 seconds.',
                        confirmButtonColor: '#8b5cf6',
                        showClass: {
                            popup: 'animate__animated animate__zoomIn animate__faster'
                        },
                        hideClass: {
                            popup: 'animate__animated animate__zoomOut animate__faster'
                        }
                    }).then(() => {
                        resetUI();
                    });
                }
            }
        }

        function checkFinalStatus() {
            let timeSpent = (Date.now() - adClickTime) / 1000;
            isWaiting = false;

            if (timeSpent >= 10) {
                timerContainer.style.display = 'none';
                instructionText.style.display = 'block';
                mainTitle.innerText = "Ready!";
                instructionText.innerHTML = "Your file is successfully unlocked!";
                downloadBtn.style.display = 'flex';
                
                mainIcon.className = "fa-solid fa-lock-open icon-top";
                mainIcon.style.color = "#34d399";
                iconBox.style.background = "rgba(16, 185, 129, 0.1)";
                iconBox.style.borderColor = "rgba(16, 185, 129, 0.3)";
                iconBox.style.boxShadow = "0 0 20px var(--success-glow)";
                
                downloadBtn.onclick = () => {
                    window.location.href = `https://t.me/${BOT_USERNAME}?start=${fileCode}`;
                };
            }
        }

        function resetUI() {
            unlockBtn.style.display = 'flex';
            timerContainer.style.display = 'none';
            instructionText.style.display = 'block';
            mainTitle.innerText = "Get Your File";
            instructionText.innerText = "Click below, wait 10 seconds on the opened page, then come back here.";
            
            mainIcon.className = "fa-solid fa-lock icon-top";
            mainIcon.style.color = "#a78bfa";
            iconBox.style.background = "rgba(139, 92, 246, 0.1)";
            iconBox.style.borderColor = "rgba(139, 92, 246, 0.3)";
            iconBox.style.boxShadow = "0 0 15px var(--primary-glow)";
        }
    </script>
</body>
</html>
