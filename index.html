<!DOCTYPE html>
<html lang="si">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unlock Content</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: rgba(22, 29, 47, 0.75);
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --accent: #ec4899;
      --accent-glow: rgba(236, 72, 153, 0.3);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: rgba(255, 255, 255, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background-color: var(--bg);
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(99, 102, 241, 0.15) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(236, 72, 153, 0.15) 0%, transparent 40%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .glass-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 2.2rem;
      width: 100%;
      max-width: 440px;
      backdrop-filter: blur(16px);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
      text-align: center;
    }

    h2 {
      font-size: 1.5rem;
      font-weight: 800;
      margin-bottom: 0.5rem;
    }

    p.subtitle {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-bottom: 1.8rem;
      line-height: 1.5;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 0.95rem 1.2rem;
      border-radius: 14px;
      border: none;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.2s ease;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      color: white;
      box-shadow: 0 8px 20px var(--accent-glow);
    }

    .btn:hover {
      opacity: 0.95;
      transform: translateY(-1px);
    }

    .timer-circle {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.04);
      border: 3px solid var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
      font-weight: 800;
      margin: 1.2rem auto 1.2rem auto;
      color: var(--text-main);
    }

    .alert {
      padding: 0.85rem;
      border-radius: 12px;
      font-size: 0.85rem;
      margin-bottom: 1.2rem;
      background: rgba(99, 102, 241, 0.15);
      color: #a5b4fc;
    }
  </style>
</head>
<body>

  <div class="glass-card">
    <h2>Unlock Content</h2>
    <p class="subtitle">Complete the short verification step below to receive your file directly on Telegram.</p>

    <div class="alert" id="statusMsg">
      Click below to open the sponsor link and verify.
    </div>

    <!-- Step 1 Button -->
    <button id="adBtn" class="btn" onclick="startVerification()">
      ⚡️ Step 1: Open Sponsor Link
    </button>

    <!-- Timer Display -->
    <div id="timerContainer" style="display: none;">
      <div class="timer-circle" id="timerCount">15</div>
      <p style="color: var(--text-muted); font-size: 0.85rem; margin-bottom: 1rem;">
        Verifying... Please wait a moment.
      </p>
    </div>

    <!-- Step 2 Button -->
    <button id="finalGetBtn" class="btn" style="display: none;" onclick="goToBot()">
      📥 Step 2: Get File on Telegram
    </button>
  </div>

  <script>
    // --- CONFIGURATION ---
    const AD_DIRECT_LINK = "https://www.google.com"; // මෙතනට ඔබගේ Adsterra Direct Link එක දමන්න
    const BOT_USERNAME = "FileStoreSl_bot";          // Bot Username එක
    const WAIT_SECONDS = 15;

    // Decryption Setup
    const CHARS = "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz-_";
    const SHIFT = 27; // tools.html එකේ අගයම විය යුතුය

    function descramble(str) {
      return str.split('').map(c => {
        let idx = CHARS.indexOf(c);
        if (idx === -1) return c;
        let originalIdx = (idx - SHIFT + CHARS.length) % CHARS.length;
        return CHARS[originalIdx];
      }).join('');
    }

    // URL Query කියවීම (?t= හෝ ?start=)
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('t');
    let realFileCode = urlParams.get('start');

    if (token) {
      realFileCode = descramble(token);
    }

    let timerInterval = null;

    function startVerification() {
      // 1. Direct Link ad එක new tab එකක open කිරීම
      window.open(AD_DIRECT_LINK, '_blank');

      // 2. Countdown ආරම්භ කිරීම
      document.getElementById('adBtn').style.display = 'none';
      document.getElementById('timerContainer').style.display = 'block';
      document.getElementById('statusMsg').innerText = "Countdown in progress... Please keep this page open!";

      let timeLeft = WAIT_SECONDS;
      const timerCount = document.getElementById('timerCount');
      timerCount.innerText = timeLeft;

      timerInterval = setInterval(() => {
        timeLeft--;
        timerCount.innerText = timeLeft;

        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          document.getElementById('timerContainer').style.display = 'none';
          document.getElementById('finalGetBtn').style.display = 'flex';
          
          const status = document.getElementById('statusMsg');
          status.style.background = "rgba(16, 185, 129, 0.15)";
          status.style.color = "#6ee7b7";
          status.innerText = "Verified successfully! Click below to open Telegram.";
        }
      }, 1000);
    }

    function goToBot() {
      if (realFileCode) {
        window.location.href = `https://t.me/${BOT_USERNAME}?start=${realFileCode}`;
      } else {
        alert("Invalid file request!");
      }
    }
  </script>
</body>
</html>
