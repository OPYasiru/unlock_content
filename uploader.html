<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HotLanka - Admin Engine</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0a0c14;
            --card-bg: rgba(18, 19, 31, 0.85);
            --card-border: rgba(138, 75, 255, 0.2);
            --primary-purple: #7928ca;
            --accent-purple: #9d4edd;
            --neon-glow: rgba(157, 78, 221, 0.4);
            --text-main: #f8f9fa;
            --text-muted: #9496a8;
            --input-bg: #11131f;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 50% 10%, rgba(121, 40, 202, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(157, 78, 221, 0.08) 0%, transparent 40%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
        }

        .dashboard-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            width: 100%;
            max-width: 540px;
            padding: 36px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 30px rgba(121, 40, 202, 0.1);
            position: relative;
        }

        .icon-wrapper {
            width: 68px;
            height: 68px;
            background: rgba(121, 40, 202, 0.15);
            border: 1px solid rgba(157, 78, 221, 0.3);
            border-radius: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 20px auto;
            box-shadow: 0 8px 24px rgba(121, 40, 202, 0.25);
        }

        .icon-wrapper svg {
            width: 32px;
            height: 32px;
            fill: #c77dff;
        }

        .header-section {
            text-align: center;
            margin-bottom: 28px;
        }

        .header-title {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #ffffff 30%, #c77dff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 6px;
        }

        .header-subtitle {
            font-size: 13.5px;
            color: var(--text-muted);
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #d1d3e2;
            margin-bottom: 8px;
        }

        .input-box {
            width: 100%;
            background: var(--input-bg);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            padding: 13px 16px;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: all 0.25s ease;
        }

        .input-box:focus {
            border-color: var(--accent-purple);
            box-shadow: 0 0 16px var(--neon-glow);
        }

        .btn-upload {
            width: 100%;
            background: linear-gradient(135deg, #7928ca, #9d4edd);
            border: none;
            border-radius: 14px;
            padding: 15px;
            color: #fff;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 8px 24px rgba(121, 40, 202, 0.4);
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-upload:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 28px rgba(157, 78, 221, 0.5);
        }

        .btn-upload:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        /* Progress Bar */
        .progress-container {
            margin-top: 24px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            height: 8px;
            width: 100%;
            overflow: hidden;
            display: none;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #7928ca, #c77dff);
            box-shadow: 0 0 12px #9d4edd;
            transition: width 0.3s ease;
        }

        /* Live Terminal Box */
        .terminal-box {
            margin-top: 20px;
            background: #090a10;
            border: 1px solid rgba(138, 75, 255, 0.25);
            border-radius: 14px;
            padding: 14px;
            height: 150px;
            overflow-y: auto;
            font-family: 'Courier New', Courier, monospace;
            font-size: 12.5px;
            color: #d1d5db;
            display: none;
        }

        .log-item {
            margin-bottom: 6px;
            line-height: 1.4;
        }

        .log-item.success { color: #4ade80; }
        .log-item.error { color: #f87171; }
        .log-item.info { color: #c084fc; }
    </style>
</head>
<body>

<div class="dashboard-card">
    <div class="icon-wrapper">
        <svg viewBox="0 0 24 24">
            <path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM14 13v4h-4v-4H7l5-5 5 5h-3z"/>
        </svg>
    </div>

    <div class="header-section">
        <h2 class="header-title">HotLanka Bot Engine</h2>
        <p class="header-subtitle">Auto CDN Downloader & Telegram Broadcaster</p>
    </div>

    <div class="form-group">
        <label>🎬 Video Direct URL (.mp4):</label>
        <input type="text" id="videoUrl" class="input-box" placeholder="https://vidserv.cc/...mp4">
    </div>

    <div class="form-group">
        <label>🖼️ Poster / Thumbnail URL (.jpg):</label>
        <input type="text" id="imageUrl" class="input-box" placeholder="https://xbaaz.com/...jpg">
    </div>

    <button id="submitBtn" class="btn-upload" onclick="startUpload()">
        <span>🚀 Start Auto-Upload & Post</span>
    </button>

    <div class="progress-container" id="progContainer">
        <div class="progress-bar" id="progBar"></div>
    </div>

    <div class="terminal-box" id="termBox"></div>
</div>

<script>
// ඔබගේ සක්‍රිය LocalTunnel URL එක
const API_BASE = "https://green-cups-strive.loca.lt";

function appendLog(text, type = "info") {
    const box = document.getElementById("termBox");
    box.style.display = "block";
    const line = document.createElement("div");
    line.className = `log-item ${type}`;
    line.innerText = text;
    box.appendChild(line);
    box.scrollTop = box.scrollHeight;
}

function startUpload() {
    const vUrl = document.getElementById("videoUrl").value.trim();
    const iUrl = document.getElementById("imageUrl").value.trim();
    const btn = document.getElementById("submitBtn");
    const progContainer = document.getElementById("progContainer");
    const progBar = document.getElementById("progBar");
    const termBox = document.getElementById("termBox");

    if (!vUrl) {
        alert("කරුණාකර Video Direct URL එක ඇතුළත් කරන්න!");
        return;
    }

    btn.disabled = true;
    btn.innerHTML = "<span>⚙️ Processing in Cloud...</span>";
    progContainer.style.display = "block";
    progBar.style.width = "5%";
    termBox.innerHTML = "";

    // Server-Sent Events (SSE) Stream
    const streamEndpoint = `${API_BASE}/stream_upload?video_url=${encodeURIComponent(vUrl)}&image_url=${encodeURIComponent(iUrl)}`;
    const eventSource = new EventSource(streamEndpoint);

    eventSource.onmessage = function(e) {
        const payload = JSON.parse(e.data);
        let logType = "info";
        if (payload.message.includes("✅") || payload.message.includes("🎉")) logType = "success";
        if (payload.message.includes("❌")) logType = "error";

        appendLog(payload.message, logType);

        if (payload.progress) {
            progBar.style.width = payload.progress + "%";
        }

        if (payload.progress >= 100) {
            eventSource.close();
            btn.disabled = false;
            btn.innerHTML = "<span>🚀 Start Auto-Upload & Post</span>";
        }
    };

    eventSource.onerror = function() {
        appendLog("❌ Connection closed or error occurred.", "error");
        eventSource.close();
        btn.disabled = false;
        btn.innerHTML = "<span>🚀 Start Auto-Upload & Post</span>";
    };
}
</script>

</body>
</html>
